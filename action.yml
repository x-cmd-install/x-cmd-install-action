name: 'x-cmd-install-action'
description: 'Composite action that runs card → loc → scorecard for an x-cmd-install/<software> repo, then commits the concatenated YAML to data/<YYMMDD>.yml. Reads upstream from .x-cmd/fskv/ownerrepo and (optionally) scorecard from .x-cmd/fskv/scorecard_ownerrepo — no inputs required.'

inputs:
  commit-message:
    description: 'Commit message for the data commit.'
    required: false
    default: 'card: collect <YYMMDD> snapshot'

outputs:
  data-path:
    description: 'Path to the concatenated YAML inside the runner.'
  collected-at:
    description: 'ISO-8601 timestamp of when the card stage ran.'

runs:
  using: 'composite'
  steps:
    # Read upstream owner/repo from the caller's .x-cmd/fskv/. This is
    # the predefined metadata store; the action treats the values as
    # immutable per-repo. We also read scorecard_ownerrepo if it
    # exists (set when the upstream was renamed), otherwise fall back
    # to the same owner-repo path.
    - name: Read upstream from fskv
      id: fskv
      shell: bash
      run: |
        set -eo pipefail
        OWNER_REPO=$(cat .x-cmd/fskv/ownerrepo)
        SCORECARD_REPO=$(cat .x-cmd/fskv/scorecard_ownerrepo 2>/dev/null || echo "$OWNER_REPO")
        # repology_name is opt-in: if .x-cmd/fskv/repology_name exists,
        # the Repology step fetches that project. Otherwise the step
        # is skipped entirely — we don't assume a default key, because
        # wrong names silently produce a 200 with empty results.
        if [ -f .x-cmd/fskv/repology_name ]; then
            REPOL_NAME=$(cat .x-cmd/fskv/repology_name)
            echo "repology=$REPOL_NAME" >> "$GITHUB_OUTPUT"
        else
            echo "repology=<unset>" >&2
        fi
        echo "owner-repo=$OWNER_REPO"
        echo "scorecard=$SCORECARD_REPO"
        echo "owner-repo=$OWNER_REPO" >> "$GITHUB_OUTPUT"
        echo "scorecard=$SCORECARD_REPO" >> "$GITHUB_OUTPUT"

    - name: Install x-cmd
      id: install
      # Hardcoded to x7 (alpha). All callers should ride the latest
      # x-cmd release stream; the `stream` input was removed in this
      # iteration to keep behavior consistent across the org.
      uses: x-cmd-action/x-cmd@v1
      with:
        stream: x7

    # x repo loc depends on the `tokei` binary. The x-cmd base install
    # doesn't pull it in — `x env use tokei` is the canonical way to
    # make it available on PATH. (The taiki-e action puts tokei in
    # $HOME/.cargo/bin, but x-cmd's `x which` looks in its own pkg
    # dir and says "not found", so x repo loc silently returns empty.)
    - name: Install tokei via x-cmd
      shell: bash
      run: |
        set +o errexit
        . "$HOME/.x-cmd.root/X"
        x env use tokei
        command -v tokei

    - name: Run card stage
      id: card
      shell: bash
      env:
        OWNER_REPO: ${{ steps.fskv.outputs.owner-repo }}
        # x-cmd reads GH_TOKEN first, falling back to GITHUB_TOKEN.
        # The runner's GITHUB_TOKEN gives 1000 req/h per repo —
        # enough for the 2 API calls card makes per run.
        GH_TOKEN: ${{ github.token }}
      run: |
        # Note: no `set -u` here — the X file from x-cmd-action/x-cmd
        # references unset variables on its first line and would crash
        # under nounset. We keep errexit + pipefail for safety.
        set -eo pipefail
        # shellcheck disable=SC1091
        . "$HOME/.x-cmd.root/X"
        x repo card --yml "$OWNER_REPO" > /tmp/card.yml
        echo "card-bytes=$(wc -c < /tmp/card.yml)" >> "$GITHUB_OUTPUT"
        echo "collected-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Run loc stage
      id: loc
      shell: bash
      env:
        OWNER_REPO: ${{ steps.fskv.outputs.owner-repo }}
        GH_TOKEN: ${{ github.token }}
      # x repo loc depends on a working tokei clone of the upstream
      # repo. We've seen it fail silently in some runner configurations
      # (no tokei on PATH, clone of an empty/forked repo, network).
      # Rather than fail the whole run, write whatever x produces
      # — possibly an empty doc — and let the next stage / aggregator
      # decide what to do with it.
      continue-on-error: true
      run: |
        set -eo pipefail
        . "$HOME/.x-cmd.root/X"
        if ! command -v tokei >/dev/null; then
            # Fallback: x-cmd's own package manager. `x env use tokei`
            # symlinks the binary into the x-cmd-managed bin dir.
            x env use tokei || true
        fi
        : > /tmp/loc.yml
        if command -v tokei >/dev/null; then
            x repo loc --yml "$OWNER_REPO" > /tmp/loc.yml 2> /tmp/loc.err || {
                echo "loc stage non-fatal error (rc=$?); keeping empty section" >&2
                cat /tmp/loc.err >&2
                : > /tmp/loc.yml
            }
        else
            echo "tokei still not on PATH after x env use; skipping loc content" >&2
        fi
        echo "loc-bytes=$(wc -c < /tmp/loc.yml)" >> "$GITHUB_OUTPUT"

    - name: Run scorecard stage
      id: scorecard
      shell: bash
      env:
        OWNER_REPO: ${{ steps.fskv.outputs.owner-repo }}
        SCORECARD_REPO: ${{ steps.fskv.outputs.scorecard }}
      run: |
        set -eo pipefail
        . "$HOME/.x-cmd.root/X"
        # Strip the `documentation:` block from each check entry —
        # verbose docs URLs that bloat the data file with no per-project
        # value. yq correctly handles YAML, so we don't have to guess
        # at indentation.
        x scorecard info --yml "github.com/${SCORECARD_REPO}" \
            | yq 'del(.checks[].documentation)' > /tmp/scorecard.yml
        echo "scorecard-bytes=$(wc -c < /tmp/scorecard.yml)" >> "$GITHUB_OUTPUT"

    # 4th section: eget asset map. For each of the 6 platform/CPU
    # combos (darwin/linux × arm64/amd64 × musl/gnu), pick the best
    # release asset eget would actually download. Pure read-only
    # diagnostic — doesn't affect eget's download choice, but useful
    # for tracking cross-platform coverage. Soft-fail on eget errors.
    #
    # NB: do NOT pass --yml here. The x7 stream's `x eget lsassetmap`
    # doesn't accept --yml (it was renamed/removed in this version);
    # its default output is already YAML-shaped, which yq parses fine.
    - name: Run eget asset map stage
      id: eget
      continue-on-error: true
      shell: bash
      env:
        OWNER_REPO: ${{ steps.fskv.outputs.owner-repo }}
      run: |
        set -eo pipefail
        . "$HOME/.x-cmd.root/X"
        : > /tmp/eget.yml
        if x eget lsassetmap "$OWNER_REPO" > /tmp/eget.yml 2> /tmp/eget.err; then
            echo "eget-bytes=$(wc -c < /tmp/eget.yml)" >> "$GITHUB_OUTPUT"
        else
            echo "eget lsassetmap failed (rc=$?); keeping empty section" >&2
            cat /tmp/eget.err >&2
            : > /tmp/eget.yml
        fi

    - name: Fetch latest release metadata
      id: release
      continue-on-error: true
      shell: bash
      env:
        OWNER_REPO: ${{ steps.fskv.outputs.owner-repo }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        mkdir -p /tmp/release
        out_rel="/tmp/release/latest.release.raw.json"
        # Use plain curl + capture the HTTP code ourselves. -f hides
        # the error message in some curl builds when combined with -s,
        # so we keep -s for silent body but drop -f and decide success
        # from the http_code.
        http=$(curl -sSL -o "$out_rel" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER_REPO}/releases/latest")
        if [ "$http" = "200" ] && [ -s "$out_rel" ]; then
            echo "release-bytes=$(wc -c < "$out_rel")" >> "$GITHUB_OUTPUT"
        else
            echo "release fetch failed (http=$http, bytes=$(wc -c < "$out_rel" 2>/dev/null || echo 0))" >&2
            # curl with -o writes the body even on HTTP error. Show the
            # first line of the body if it looks like JSON (helps when
            # 403/429 etc. return a JSON error message).
            if [ -s "$out_rel" ]; then
                head -c 500 "$out_rel" | sed 's/^/  body: /' >&2 || true
            fi
            : > "$out_rel"
        fi

    # Repology aggregates package versions across 250+ distros
    # (Debian, Ubuntu, Arch, Homebrew, Nix, FreeBSD, ...). We mirror
    # the project's status JSON to data/repology/ so it ships with
    # the repo and downstream consumers can read it from
    # raw.githubusercontent.com like any other card file. Both raw
    # (JSON) and normalized (YAML) forms are written — the YAML form
    # makes the data line-diffable in PRs.
    - name: Fetch repology project data
      id: repology
      if: ${{ steps.fskv.outputs.repology != '' }}
      continue-on-error: true
      shell: bash
      env:
        REPOL_NAME: ${{ steps.fskv.outputs.repology }}
      run: |
        set -eo pipefail
        mkdir -p /tmp/repology
        out_raw="/tmp/repology/latest.repology.raw.json"
        out_yml="/tmp/repology/latest.repology.yml"
        name="$REPOL_NAME"
        # Repology returns 403 to clients without a User-Agent.
        http=$(curl -sSL --max-time 15 \
              -H "User-Agent: Mozilla/5.0" \
              -o "$out_raw" \
              -w '%{http_code}' \
              "https://repology.org/api/v1/project/${name}")
        if [ "$http" = "200" ] && [ -s "$out_raw" ]; then
            # Validate it's actually JSON, then convert to YAML.
            if python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$out_raw" 2>/dev/null; then
                # JSON ⊂ YAML 1.1 — we can dump the same JSON as YAML
                # without losing structure. yq is the standard tool for
                # this on the runner (no PyYAML needed).
                if yq -P -o=yaml '.' "$out_raw" > "$out_yml" 2>/dev/null; then
                    echo "repology-bytes=$(wc -c < "$out_raw")" >> "$GITHUB_OUTPUT"
                else
                    echo "repology: yq conversion failed; keeping raw JSON only" >&2
                    : > "$out_yml"
                fi
            else
                echo "repology: not valid JSON (http=$http); skipping" >&2
                : > "$out_raw"
                : > "$out_yml"
            fi
        else
            echo "repology fetch failed (http=$http, project=$name); skipping" >&2
            : > "$out_raw"
            : > "$out_yml"
        fi

    - name: Concatenate and commit
      shell: bash
      env:
        COMMIT_MSG: ${{ inputs.commit-message }}
      run: |
        set -eo pipefail
        d=$(date -u +%y%m%d)

        # Layout (v0.4 → v0.5):
        #   data/
        #     ├── card/<YYMMDD>.yml                (4 sections: card + loc + scorecard + eget)
        #     ├── release/latest.release.raw.json    (raw GitHub API)
        #     └── latest.report.yml                  (NEW: card+release merged, single fetch)
        #
        # The flat data/<YYMMDD>.yml path is kept during the
        # transition window so old aggregator builds keep working.
        # A follow-up batch will move the historical files to
        # data/history/ and drop the flat path.
        #
        # latest.report.yml merges the two source files with `---` so
        # the aggregator can pull one CDN GET per mirror instead of
        # two, and downstream consumers get a single file with both
        # card and release fields side by side.

        mkdir -p data/card data/release data/repology

        out_card="data/card/${d}.yml"
        {
          cat /tmp/card.yml
          printf -- '---\n'
          cat /tmp/loc.yml
          printf -- '---\n'
          cat /tmp/scorecard.yml
          printf -- '---\n'
          cat /tmp/eget.yml
        } > "$out_card"

        cp /tmp/release/latest.release.raw.json data/release/latest.release.raw.json 2>/dev/null || true
        cp /tmp/repology/latest.repology.raw.json data/repology/latest.repology.raw.json 2>/dev/null || true
        cp /tmp/repology/latest.repology.yml    data/repology/latest.repology.yml    2>/dev/null || true

        # Build latest.report.yml = 3 card docs (no eget) + 1 release
        # doc, with the release JSON converted to YAML. url* keys in
        # the release section are stripped first to keep the file
        # compact.
        if [ -s /tmp/release/latest.release.raw.json ]; then
            # Strip url* keys, then emit YAML directly. The Python
            # script does both the url-strip AND the JSON→YAML
            # conversion (avoids the yq -P bug where it silently
            # falls back to JSON for the GitHub release payload).
            python3 "$GITHUB_ACTION_PATH/scripts/strip_url_keys.py" \
                < /tmp/release/latest.release.raw.json \
                | tee /tmp/release.stripped.json > /dev/null
            {
                # First 3 docs: card data only — eget is excluded
                # (it's diagnostic noise for downstream consumers).
                cat /tmp/card.yml
                printf -- '---\n'
                cat /tmp/loc.yml
                printf -- '---\n'
                cat /tmp/scorecard.yml
                # 4th doc: release (already YAML after the script)
                printf -- '---\n'
                cat /tmp/release.stripped.json
            } | tee data/latest.report.yml > /dev/null
        else
            # No release available — just emit the 3 card docs
            {
                cat /tmp/card.yml
                printf -- '---\n'
                cat /tmp/loc.yml
                printf -- '---\n'
                cat /tmp/scorecard.yml
            } | tee data/latest.report.yml > /dev/null
        fi

        echo "card-data-path=$out_card" >> "$GITHUB_OUTPUT"
        echo "report-data-path=data/latest.report.yml" >> "$GITHUB_OUTPUT"

        if git status --porcelain -- data/ | grep -q .; then
            git config user.name  "x-cmd-install-bot"
            git config user.email "bot@x-cmd.com"
            git add data/
            git commit -m "$COMMIT_MSG"
            git push
        else
            echo "no data changes to commit"
        fi

    # One-shot migration: any pre-v0.5 flat data/<YYMMDD>.yml gets moved
    # to data/history/<YYMMDD>.yml. A sentinel file marks completion so
    # subsequent runs skip this work. Drop this step after all mirrors
    # have run it once.
    - name: Migrate flat data/<date>.yml to data/history/
      if: "! hashFiles('data/history/.migrated')"
      shell: bash
      run: |
        set -eo pipefail
        mkdir -p data/history
        moved=0
        # Match the legacy flat-path pattern: data/<6-digit YYMMDD>.yml.
        # Latest snapshot under data/card/ is unaffected (that's the
        # canonical path going forward).
        for f in data/[0-9][0-9][0-9][0-9][0-9][0-9].yml; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            git mv "$f" "data/history/$base" 2>/dev/null || mv "$f" "data/history/$base"
            moved=$((moved+1))
        done
        echo "migrated=$moved flat files to data/history/"
        touch data/history/.migrated
        if [ "$moved" -gt 0 ]; then
            git config user.name  "x-cmd-install-bot"
            git config user.email "bot@x-cmd.com"
            git add data/
            git commit -m "chore: migrate legacy data/<YYMMDD>.yml to data/history/ (one-shot)"
            git push
        fi

    # Render a compact per-mirror README.md from today's card data and
    # commit it alongside data/. The README is generated from scratch
    # each run — its content is fully derived from the card snapshot,
    # so there's no risk of stale prose.
    #
    # Why the template lives in scripts/generate_readme.py rather than
    # a bash heredoc here: GitHub Actions' simplified YAML parser
    # refuses to accept any line containing ': ' inside a literal-block
    # scalar (the markdown is full of those). Moving the template out
    # of action.yml avoids the parser quirk entirely.
    - name: Generate README.md
      shell: bash
      env:
        OWNER_REPO: ${{ steps.fskv.outputs.owner-repo }}
      run: |
        set -eo pipefail
        d=$(date -u +%y%m%d)

        # shellcheck disable=SC1091
        . "$HOME/.x-cmd.root/X"
        # Build the assets table from the stripped release JSON. We
        # used to pipe through `x eget classify --tsv`, but its awk
        # implementation crashes on certain GNU awk versions in the
        # runner with 'illegal reference to array tokens'. Doing the
        # tiny classification ourselves in Python is more reliable and
        # gives us full control over the output shape.
        python3 "$GITHUB_ACTION_PATH/scripts/classify_assets.py" "$OWNER_REPO" \
            < /tmp/release.stripped.json > /tmp/classify.tsv 2>/dev/null \
            || : > /tmp/classify.tsv

        # The script writes both README.md (English) and README.cn.md
        # (Chinese) into the current working directory. Cross-language
        # links at the top of each file point at the other.
        python3 "$GITHUB_ACTION_PATH/scripts/generate_readme.py" \
            /tmp/card.yml /tmp/loc.yml /tmp/scorecard.yml /tmp/classify.tsv \
            "$OWNER_REPO" "$d"

        if git status --porcelain -- README.md README.cn.md | grep -q .; then
            git config user.name  "x-cmd-install-bot"
            git config user.email "bot@x-cmd.com"
            git add README.md README.cn.md
            git commit -m "docs: regenerate README.md + README.cn.md from card snapshot ${d}"
            git push
        else
            echo "no README changes to commit"
        fi

branding:
  icon: 'database'
  color: 'blue'
