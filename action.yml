name: 'x-cmd-install-action'
description: 'Composite action that runs card → loc → scorecard for an x-cmd-install/<software> repo, then commits the concatenated YAML to data/<YYMMDD>.yml.'

inputs:
  owner-repo:
    description: 'Upstream owner/repo (e.g. jqlang/jq). Used by card and loc stages.'
    required: true
  scorecard:
    description: |
      GitHub owner/repo path for the OpenSSF scorecard API. Defaults to
      owner-repo. May differ when a project was renamed — e.g. jq moved
      from github.com/stedolan/jq to github.com/jqlang/jq, but the
      scorecard backend still tracks the historical name. Set to
      "stedolan/jq" in that case.
    required: false
    default: ''
  stream:
    description: 'x-cmd release stream for the installer (x7 = alpha, index.html = stable).'
    required: false
    default: 'x7'
  commit-message:
    description: 'Commit message for the data commit.'
    required: false
    default: 'card: collect <YYMMDD> snapshot'

outputs:
  data-path:
    description: 'Path to the concatenated YAML inside the runner.'
  collected-at:
    description: 'ISO-8601 timestamp of when the card stage ran.'

runs:
  using: 'composite'
  steps:
    - name: Install x-cmd
      id: install
      uses: x-cmd-action/x-cmd@v1
      with:
        stream: ${{ inputs.stream }}

    # x repo loc depends on the `tokei` binary, which the x-cmd base
    # install doesn't pull in. Install it via the official Rust action
    # so the loc stage has something to run.
    - name: Install tokei
      uses: taiki-e/install-action@v2
      with:
        tool: tokei

    - name: Run card stage
      id: card
      shell: bash
      env:
        OWNER_REPO: ${{ inputs.owner-repo }}
        # x-cmd reads GH_TOKEN first, falling back to GITHUB_TOKEN.
        # The runner's GITHUB_TOKEN gives 1000 req/h per repo —
        # enough for the 2 API calls card makes per run.
        GH_TOKEN: ${{ github.token }}
      run: |
        # Note: no `set -u` here — the X file from x-cmd-action/x-cmd
        # references unset variables on its first line and would crash
        # under nounset. We keep errexit + pipefail for safety.
        set -eo pipefail
        # shellcheck disable=SC1091
        . "$HOME/.x-cmd.root/X"
        x repo card --yml "$OWNER_REPO" > /tmp/card.yml
        echo "card-bytes=$(wc -c < /tmp/card.yml)" >> "$GITHUB_OUTPUT"
        echo "collected-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Run loc stage
      id: loc
      shell: bash
      env:
        OWNER_REPO: ${{ inputs.owner-repo }}
        GH_TOKEN: ${{ github.token }}
      # x repo loc depends on a working tokei clone of the upstream
      # repo. We've seen it fail silently in some runner configurations
      # (no tokei on PATH, clone of an empty/forked repo, network).
      # Rather than fail the whole run, write whatever x produces
      # — possibly an empty doc — and let the next stage / aggregator
      # decide what to do with it.
      continue-on-error: true
      run: |
        set -eo pipefail
        . "$HOME/.x-cmd.root/X"
        : > /tmp/loc.yml
        if command -v tokei >/dev/null; then
            x repo loc --yml "$OWNER_REPO" > /tmp/loc.yml 2> /tmp/loc.err || {
                echo "loc stage non-fatal error (rc=$?); keeping empty section" >&2
                cat /tmp/loc.err >&2
                : > /tmp/loc.yml
            }
        else
            echo "tokei not on PATH; skipping loc content" >&2
        fi
        echo "loc-bytes=$(wc -c < /tmp/loc.yml)" >> "$GITHUB_OUTPUT"

    - name: Run scorecard stage
      id: scorecard
      shell: bash
      env:
        OWNER_REPO: ${{ inputs.owner-repo }}
        SCORECARD: ${{ inputs.scorecard }}
      run: |
        set -eo pipefail
        . "$HOME/.x-cmd.root/X"
        # If scorecard input is empty, default to owner-repo. The
        # github.com/ prefix is what the openssf API expects.
        sc="${SCORECARD:-$OWNER_REPO}"
        # Strip the `documentation:` block from each check entry —
        # verbose docs URLs that bloat the data file with no per-project
        # value. yq correctly handles YAML, so we don't have to guess
        # at indentation.
        x scorecard info --yml "github.com/${sc}" \
            | yq 'del(.checks[].documentation)' > /tmp/scorecard.yml
        echo "scorecard-bytes=$(wc -c < /tmp/scorecard.yml)" >> "$GITHUB_OUTPUT"

    - name: Concatenate and commit
      shell: bash
      env:
        COMMIT_MSG: ${{ inputs.commit-message }}
      run: |
        set -eo pipefail
        d=$(date -u +%y%m%d)
        out="data/${d}.yml"
        mkdir -p data

        {
          cat /tmp/card.yml
          printf -- '---\n'
          cat /tmp/loc.yml
          printf -- '---\n'
          cat /tmp/scorecard.yml
        } > "$out"

        echo "data-path=$out" >> "$GITHUB_OUTPUT"

        if git status --porcelain -- data/ | grep -q .; then
            git config user.name  "x-cmd-install-bot"
            git config user.email "bot@x-cmd.com"
            git add data/
            git commit -m "$COMMIT_MSG"
            git push
        else
            echo "no data changes to commit"
        fi

branding:
  icon: 'database'
  color: 'blue'
